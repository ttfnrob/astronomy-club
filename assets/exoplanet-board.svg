<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
  <title id="title">Exoplanet Drawing Board</title><desc id="desc">A glowing star surrounded by illustrated planetary orbits on a starry blue background.</desc>
